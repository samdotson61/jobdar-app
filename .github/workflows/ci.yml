name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows too (1.64.3): with Linux-only CI, three tests that could never pass on Windows went unseen
    # until the first Windows drive-test — and so did a desktop build that couldn't start there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The CLI path a user takes (README: clone + npm install); the root has one runtime dep.
      - run: npm install --no-audit --no-fund
      - run: npm run doctor
      - run: npm test
      - run: node scan.mjs --dry-run
      # The published package must never carry local reports/data (1.63.1 caught docs/reports/ shipping).
      - run: '! npm pack --dry-run 2>&1 | grep -E "docs/reports/|credentials|profile\.yml$|cv\.md"'
        shell: bash # Git Bash on windows-latest (the default there is PowerShell, which has no `!`/grep)

  typecheck:
    # The Expo app (pnpm workspace). --ignore-scripts skips native postinstalls (llama.rn xcframework);
    # tsc needs only the type packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -C apps/jobdar exec tsc --noEmit -p tsconfig.json
